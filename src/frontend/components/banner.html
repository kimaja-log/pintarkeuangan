<div class="max-w-6xl mx-auto p-4 space-y-6">
  <!-- Hero Banner -->
  <section class="bg-blue-600 text-white p-8 rounded-3xl shadow-xl flex flex-col items-center text-center">
    <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-4 border border-white/30">
      <i class="fa-solid fa-robot text-2xl text-white"></i>
    </div>
    <h1 class="text-2xl md:text-3xl font-bold mb-2">Asisten Keuangan Harian Anda</h1>
    <p class="text-blue-100 text-sm max-w-xl mb-6">
      Ketik atau bicarakan transaksi Anda secara bebas, dan sistem akan langsung mencatatnya ke Google Sheets.
    </p>

    <!-- Prompt Box -->
    <div class="w-full max-w-xl bg-white rounded-2xl p-2 shadow-2xl flex items-center gap-2 text-slate-800">
      <input id="promptInput" type="text" placeholder="Contoh: Beli makan siang Rp 25.000" class="flex-1 px-4 py-2 text-sm bg-transparent outline-none">
      <button id="micBtn" onclick="toggleVoiceInput()" class="p-2 text-slate-400 hover:text-blue-600 transition">
        <i class="fa-solid fa-microphone text-lg"></i>
      </button>
      <button onclick="submitTransaction()" class="w-10 h-10 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center justify-center transition">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </div>
  </section>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
      <p class="text-xs text-slate-400 font-semibold uppercase">Total Pemasukan</p>
      <h3 id="totalMasuk" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</h3>
    </div>
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
      <p class="text-xs text-slate-400 font-semibold uppercase">Total Pengeluaran</p>
      <h3 id="totalKeluar" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</h3>
    </div>
    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
      <p class="text-xs text-slate-400 font-semibold uppercase">Saldo Bersih</p>
      <h3 id="saldoBersih" class="text-2xl font-bold text-cyan-600 mt-1">Rp 0</h3>
    </div>
  </div>
</div>
